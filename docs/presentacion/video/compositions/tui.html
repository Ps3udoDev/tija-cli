      caps.forEach((c, j) => tl.set(c, { opacity: j === i ? 1 : 0 }, t));
    };

    // The new screen comes in slightly large and settles.

    // Menu: Init is selected, enter.

    // tija init

    const frames = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
    const step = (sp, ok, dur, start, end) => {
      show(sp, start);
      const spin = { f: 0 };
      tl.to(spin, {
        f: Math.round((end - start) / 0.12),
        duration: end - start,
        ease: "none",
        onUpdate: () => {
          const el = document.querySelector(sp);
          if (el) el.textContent = frames[Math.floor(spin.f) % frames.length];
        },
      }, start);
      hide(sp, end);
      tl.fromTo(ok, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, end);
      show(dur, end);
