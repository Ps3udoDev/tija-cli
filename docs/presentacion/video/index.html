<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #081823;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div id="old" class="clip" data-composition-id="old" data-composition-src="compositions/old.html"
        data-start="0" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="reveal" class="clip" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="9" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>
      <div id="tui" class="clip" data-composition-id="tui" data-composition-src="compositions/tui.html"

        data-width="1920" data-height="1080"></div>
      <div id="pr17" class="clip" data-composition-id="pr17" data-composition-src="compositions/pr17.html"

        data-width="1920" data-height="1080"></div>

      <audio id="sfx-step1" class="clip" src="assets/sfx/pop.mp3" data-duration="0.7" data-start="0.35" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-step2" class="clip" src="assets/sfx/pop.mp3" data-duration="0.7" data-start="1.35" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-step3" class="clip" src="assets/sfx/pop.mp3" data-duration="0.7" data-start="2.35" data-track-index="3" data-volume="0.35"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
